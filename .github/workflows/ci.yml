name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  rules:
    # The detection rules are pure logic (no models, no torch), so they run
    # fast with just numpy. The model-backed tests run in the image build/local.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pytest
      - run: >
          python -m pytest -q
          tests/test_rules_attention.py tests/test_rules_audio.py
          tests/test_rules_camera_identity_objects.py tests/test_rules_presence.py
          tests/test_episodes.py tests/test_pipeline.py

  docker:
    # Builds the deployable image (CPU PyTorch, models fetched and hash-checked)
    # and checks the service comes up. Slow: several GB of wheels.
    runs-on: ubuntu-latest
    needs: rules
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t proctor-ai:ci .
      - name: Service starts, finishes loading and reports healthy
        run: |
          docker run -d --name ai -p 8901:8901 proctor-ai:ci
          # /health answers 200 "LOADING" while models load and 503 "FAILED" when a
          # capability the service cannot work without is missing (for example a
          # system library the image forgot), so wait for "ready" and then require
          # a usable status, not just an HTTP response.
          body=""
          for i in $(seq 1 90); do
            body="$(curl -s localhost:8901/health || true)"
            echo "$body" | grep -q '"models":"ready"' && break
            sleep 3
          done
          echo "$body"
          if ! echo "$body" | grep -Eq '"status":"(OK|DEGRADED)"'; then
            echo "::error::analysis service is not healthy"; docker logs ai; exit 1
          fi
          echo "$body" | grep -q '"face_tracking":true' || { echo "::error::face tracking unavailable"; docker logs ai; exit 1; }

  publish:
    # Publishes the image to GitHub Container Registry for Coolify to pull.
    # Only from main, and only after the tests and the image check pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/proctor-ai:latest
            ghcr.io/${{ github.repository_owner }}/proctor-ai:${{ github.sha }}
